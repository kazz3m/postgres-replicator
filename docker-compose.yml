services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - SOURCE_DSN=${SOURCE_DSN:-}
      - DEST_DSN=${DEST_DSN:-}
      - CONFIG_PATH=/data/config.json
    volumes:
      - pg_sync_data:/data
    networks:
      - app

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  pg_sync_data:
