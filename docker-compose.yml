services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - SOURCE_DSN=${SOURCE_DSN:-}
      - DEST_DSN=${DEST_DSN:-}
      - CONFIG_PATH=/data/config.json
      - PROFILES_PATH=/data/profiles.json
    volumes:
      - pg_sync_data:/data
    networks:
      - app

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app

networks:
  app:
    driver: bridge
    ipam:
      config:
        - subnet: 172.251.0.0/24

volumes:
  pg_sync_data:
